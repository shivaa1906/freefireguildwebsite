services:
  - type: web
    name: free-fire-guild-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI_2
        sync: false
      - key: MONGODB_URI_3
        sync: false
      - key: MONGODB_DB
        value: free_fire_guild
      - key: RANKING_MONGODB_DB
        value: free_fire_rankings
      - key: CHAT_MONGODB_DB
        value: free_fire_chat
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_ADMIN_IDS
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_COADMIN_ROLE_ID
        sync: false
      - key: DISCORD_REPORT_CHANNEL_ID
        sync: false