[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_BACKEND_URL = "https://free-fire-guild-api.onrender.com"

[dev]
  command = "npm run dev:full"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/auth/*"
  to = "https://free-fire-guild-api.onrender.com/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://free-fire-guild-api.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200